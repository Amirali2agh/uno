services:
  # 1. Redis Database Service
  redis:
    image: redis:7-alpine
    container_name: uno-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. FastAPI Backend Service
  backend:
    build: .
    container_name: uno-backend
    ports:
      - "8000:8000"
    environment:
      # Override the default localhost REDIS_URL to point to the redis container
      - REDIS_URL=redis://redis:6379/0
      # Disconnect grace period (seconds) — see app/config.py
      - DISCONNECT_TIMEOUT_SECONDS=60
      # Uncomment and set to enable GET /admin/stats
      # - ADMIN_TOKEN=change-me
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
